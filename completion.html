<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Complete</title>

<style>

body{
    font-family: Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    margin:0;
}

.container{
    max-width:800px;
}

#code{
    font-size:100px;
    font-weight:bold;
    color:#0066ff;
    margin:40px 0;
}

.code-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin:40px 0;
}

#code{
    font-size:100px;
    font-weight:bold;
    color:#0066ff;
}

#copyBtn{
    padding:12px 24px;
    font-size:20px;
    cursor:pointer;
    border:none;
    border-radius:6px;
    background:#4CAF50;
    color:white;
}

#copyBtn:hover{
    background:#45a049;
}

#copyMessage{
    color:green;
    font-size:20px;
    min-height:25px;
}

</style>

</head>
<body>

<div class="container">

    <h1>Thank You!</h1>

    <p>Your completion code is:</p>

    <div class="code-container">

    <div id="code"></div>

    <button id="copyBtn">
        Copy
    </button>

</div>

<p id="copyMessage"></p>


    <p>
        This code has been copied to your clipboard.
    </p>

    <p>
        You can now safely close this window and continue in JISC.
    </p>

</div>

<script>

const code =
    sessionStorage.getItem("completionCode");

document.getElementById("code").textContent =
    code || "ERROR";

document.getElementById("copyBtn")
    .addEventListener("click", async () => {

        try {

            await navigator.clipboard.writeText(code);

            document.getElementById("copyMessage")
                .textContent =
                "Completion code copied to clipboard.";

        } catch (err) {

            document.getElementById("copyMessage")
                .textContent =
                "Unable to copy automatically.";

        }

    });

</script>

</body>
</html>
